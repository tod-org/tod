name: Publish to crates.io
on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    # allow direct/manual runs and reusable workflow calls, while keeping tag-only release behavior for normal pushes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && github.event.base_ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: release  # optional: gives you env protection rules
    permissions:
      contents: read
      id-token: write     # required for OIDC token exchange
      packages: write     # optional, if you also publish GitHub packages
      
    steps:
      - uses: actions/checkout@v7

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
